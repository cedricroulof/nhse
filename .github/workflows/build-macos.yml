name: Build macOS app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nhse-core --release

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app bundle
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/
          cd target/aarch64-apple-darwin/release/bundle/macos
          ditto -c -k --keepParent NHSE.app ../../../../../out/NHSE-macOS-arm64.app.zip
          ls -la ../../../../../out

      - uses: actions/upload-artifact@v4
        with:
          name: NHSE-macOS-arm64
          path: out/*
          if-no-files-found: error

      - name: Publish rolling pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.ref_name == 'master' && 'master' || 'rust' }}
          name: NHSE (Rust/Tauri) — latest build from ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          body: |
            Automated build of `${{ github.sha }}` from `${{ github.ref_name }}`.

            **Install:** download the `.dmg`, drag NHSE to Applications, then run once in Terminal:
            `xattr -dr com.apple.quarantine /Applications/NHSE.app`
            (the app is ad-hoc signed, not notarized).
          files: out/*
