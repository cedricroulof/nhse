<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd99a"/>
      <stop offset="0.55" stop-color="#2cb67d"/>
      <stop offset="1" stop-color="#14876a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9fbef"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b4f3c" flood-opacity="0.35"/>
    </filter>
    <clipPath id="leafclip"><path d="M0,-300 C150,-230 210,-80 190,60 C170,190 80,270 0,300 C-80,270 -170,190 -190,60 C-210,-80 -150,-230 0,-300 Z"/></clipPath>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#outer)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  </g>
  <g filter="url(#shadow)" transform="translate(512 520) rotate(-38)">
    <path d="M0,-300 C150,-230 210,-80 190,60 C170,190 80,270 0,300 C-80,270 -170,190 -190,60 C-210,-80 -150,-230 0,-300 Z" fill="url(#leaf)"/>
    <path d="M0,-250 L0,370" stroke="#2cb67d" stroke-width="26" stroke-linecap="round"/>
    <path clip-path="url(#leafclip)" d="M0,-90 L95,-170 M0,30 L120,-50 M0,150 L105,80 M0,-90 L-95,-170 M0,30 L-120,-50 M0,150 L-105,80" stroke="#2cb67d" stroke-width="18" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
