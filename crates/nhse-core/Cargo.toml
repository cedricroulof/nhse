[package]
name = "nhse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Animal Crossing: New Horizons save file library"

[dependencies]
aes = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.17"

[dev-dependencies]
tempfile = "3"
